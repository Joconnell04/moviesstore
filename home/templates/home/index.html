{% extends 'base.html' %}
{% block content %}
<header class="masthead bg-index text-white text-center py-4">
  <div class="container d-flex align-items-center flex-column pt-2">
    <h2>Movies Store</h2>
    <p>Your Ticket to Unlimited Entertainment!</p>
  </div>
</header>
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto text-center mb-3">
        <h4>Welcome to the best movie store!!</h4>
      </div>
    </div>
  </div>
</div>
{% endblock content %}

<dialog id="feedbackModal">
  <form method="post" action="{% url 'home.feedback_submit' %}">
    {% csrf_token %}
    <h2>How was checkout?</h2>
    <p><em>Optional:</em> Leave a short statement so we can improve.</p>

    <label>Name (optional)</label>
    <input type="text" name="name" maxlength="80" style="width:100%; margin-bottom:.5rem;">

    <label>Your thoughts (required)</label>
    <textarea name="message" maxlength="500" rows="4" style="width:100%;" required></textarea>

    <div style="margin-top:1rem; display:flex; gap:.5rem;">
      <button type="submit">Submit</button>
      <button type="button" onclick="document.getElementById('feedbackModal').close()">Cancel</button>
    </div>
  </form>
</dialog>

<script>
  (function () {
    const qp = new URLSearchParams(window.location.search);
    if (qp.get('feedback') === '1') {
      const dlg = document.getElementById('feedbackModal');
      if (dlg && typeof dlg.showModal === 'function') dlg.showModal();
    }
  })();
</script>
