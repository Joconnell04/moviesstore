{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Purchase Completed</h2>
        <hr />
        <p>
          Congratulations, purchase completed. Order number is
          <b>#{{ template_data.order_id }}</b>.
        </p>
        <a href="{% url 'home.feedback_list' %}" class="btn btn-outline-secondary btn-sm">View feedback</a>
      </div>
    </div>
  </div>
</div>

<dialog id="feedbackModal">
  <form method="post" action="{% url 'home.feedback_submit' %}">
    {% csrf_token %}
    <h2>How was checkout?</h2>
    <p><em>Optional:</em> Leave a short statement so we can improve.</p>

    <label for="fb-name">Name (optional)</label>
    <input id="fb-name" type="text" name="name" maxlength="80" class="form-control mb-2">

    <label for="fb-message">Your thoughts (required)</label>
    <textarea id="fb-message" name="message" maxlength="500" rows="4" class="form-control" required></textarea>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn bg-dark text-white">Submit</button>
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('feedbackModal').close()">Cancel</button>
    </div>
  </form>
</dialog>

<script>
  (function () {
    const qp = new URLSearchParams(window.location.search);
    const fromQuery = qp.get('feedback') === '1';
    const fromTemplate = "{{ template_data.show_feedback_modal|yesno:'true,false' }}";
    const shouldOpen = fromQuery || fromTemplate;

    if (shouldOpen) {
      const dlg = document.getElementById('feedbackModal');
      if (dlg && typeof dlg.showModal === 'function') dlg.showModal();
    }
  })();
</script>
{% endblock content %}
